[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-cognitive-speech"
version = "0.1.0"
description = "Reproducible domain-incremental text and cognitive-speech experiments"
requires-python = ">=3.10"
dependencies = ["pyarrow==23.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
