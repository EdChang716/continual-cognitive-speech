[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-cognitive-speech"
version = "0.2.0"
description = "Reproducible domain-incremental text and cognitive-speech experiments"
requires-python = ">=3.10"
dependencies = ["pyarrow==23.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
audit = [
    "opencc-python-reimplemented==0.1.7", "rapidfuzz==3.14.3",
    "numpy==2.2.6", "scipy==1.15.3", "soundfile==0.13.1",
]
train = [
    "torch==2.8.0", "transformers==4.51.3", "numpy==2.2.6",
    "scipy==1.15.3", "soundfile==0.13.1", "scikit-learn==1.6.1",
    "sentencepiece==0.2.0", "librosa==0.11.0", "soxr==1.1.0",
]

[project.scripts]
ccspeech = "ccspeech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
